<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonto Thumbnail</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d0d1a;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
        }

        .thumbnail-container {
            width: 1280px; /* مقاس اليوتيوب والمنصات القياسي */
            height: 720px;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 4px solid #ffcc00;
        }

        /* الكروت اللي في الخلفية */
        .bg-card {
            position: absolute;
            width: 200px;
            height: 300px;
            background: linear-gradient(135deg, #111, #333);
            border: 4px solid #444;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            opacity: 0.4;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
        }

        .card-1 { top: 10%; left: 15%; transform: rotate(-25deg); border-color: #c00000; color: #c00000; }
        .card-2 { bottom: 10%; right: 15%; transform: rotate(20deg); border-color: #004aad; color: #004aad; }
        .card-3 { top: 20%; right: 25%; transform: rotate(15deg); border-color: #ffcc00; color: #ffcc00; opacity: 0.2; }
        .card-4 { bottom: 15%; left: 20%; transform: rotate(-10deg); border-color: #38b000; color: #38b000; opacity: 0.2; }

        /* الشعار الرئيسي */
        .title-wrapper {
            z-index: 10;
            text-align: center;
        }

        .main-title {
            font-size: 140px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 20px #ffcc00, 0 5px 0 #d35400, 0 10px 20px #000;
            margin: 0;
            line-height: 1;
            letter-spacing: -2px;
        }

        .sub-title {
            font-size: 50px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 40px;
            border-radius: 50px;
            border: 2px solid #00e5ff;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
        }

        .features {
            display: flex;
            gap: 40px;
            margin-top: 50px;
            z-index: 10;
        }

        .feature-badge {
            background: linear-gradient(135deg, #d35400, #c00000);
            color: white;
            padding: 15px 30px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 10px;
            border: 3px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transform: skew(-10deg);
        }

        .feature-badge span {
            display: inline-block;
            transform: skew(10deg);
        }

        /* تأثير إضاءة الملعب */
        .glow-overlay {
            position: absolute;
            bottom: -200px;
            width: 1000px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(56, 176, 0, 0.4) 0%, transparent 70%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="thumbnail-container">
        <!-- الكروت في الخلفية -->
        <div class="bg-card card-1">⚔️</div>
        <div class="bg-card card-2">🛡️</div>
        <div class="bg-card card-3">👑</div>
        <div class="bg-card card-4">⚽</div>

        <div class="glow-overlay"></div>

        <!-- العناوين -->
        <div class="title-wrapper">
            <h1 class="main-title">بونطو</h1>
            <div class="sub-title">TACTICAL PRO</div>
        </div>

        <!-- الميزات -->
        <div class="features">
            <div class="feature-badge"><span>نسخة الأساطير 🌟</span></div>
            <div class="feature-badge" style="background: linear-gradient(135deg, #004aad, #002e73);"><span>بدون حظ، تكتيك فقط 🧠</span></div>
        </div>
    </div>

</body>
</html>
